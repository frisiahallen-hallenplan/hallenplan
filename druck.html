<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=900">
  <title>Friesenhalle – Druckansicht</title>
  <style id="druckStil"></style>
</head>
<body>
  <!-- Druckseite für Handy/Tablet (iOS-Safari kann aus der Bearbeitungsseite nicht gezielt drucken) -->
  <div class="leiste">
    <a href="admin.html">← Zurück</a>
    <button onclick="window.print()">🖨 Drucken / als PDF sichern</button>
    <span>iPhone/iPad: im Druckfenster oben rechts auf <b>Teilen</b> tippen → <b>In Dateien sichern</b> – oder direkt drucken.</span>
  </div>
  <div id="inhalt"><p>Plan wird geladen …</p></div>
  <script src="druck.js?v=20261109c"></script>
  <script>
    (async () => {
      const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxQoYZ4-mKq6C0xwSAqkMP2qkHSFXcW3qcV5BBSKCSw321cqRYgna72jZEi_vRVmncQ/exec';
      const druck = window.friesenhallenDruck;
      const inhalt = document.getElementById('inhalt');
      try {
        const rows = await (await fetch(ENDPOINT)).json();
        const { dateiname, seiten, format } = druck.teile(rows, new URLSearchParams(location.search).get('modus') || 'naechste');
        document.title = dateiname;
        document.getElementById('druckStil').textContent = druck.css(format);
        inhalt.innerHTML = seiten;
      } catch (e) {
        inhalt.textContent = 'Der Plan konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.';
      }
    })();
  </script>
</body>
</html>
